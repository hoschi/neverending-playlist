openapi: 3.0.0
info:
  title: Spotify Playlist Sync API
  version: 1.0.0
paths:
  /sync-playlist:
    post:
      summary: Sync a playlist with a list of songs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPlaylistRequest'
      responses:
        '200':
          description: Songs processed successfully (may include songs not found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPlaylistResponse'
        '400':
          description: An error occurred while processing one or more songs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPlaylistResponse'
components:
  schemas:
    SongRequest:
      type: object
      properties:
        song_title:
          type: string
        artist_name:
          type: string
    SyncPlaylistRequest:
      type: object
      properties:
        playlist_id:
          type: string
          format: uuid
        songs:
          type: array
          items:
            $ref: '#/components/schemas/SongRequest'
    SyncPlaylistResponse:
      type: object
      properties:
        successful:
          type: array
          items:
            $ref: '#/components/schemas/SongRequest'
        not_found:
          type: array
          items:
            $ref: '#/components/schemas/SongRequest'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/SongRequest'
